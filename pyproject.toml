[project]
name = "oms-core"
version = "1.2.0"
description = "Local skill custody, manual learning and portable publication"
requires-python = ">=3.12"
license = "SUL-1.0"
dependencies = [
    "neo4j>=5.20,<7",
    "pydantic>=2.7,<3",
    "mcp==1.27.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "packaging>=24",
]

[project.scripts]
oms = "oms.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "testcontainers[neo4j]>=4"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a disposable Neo4j database"]
